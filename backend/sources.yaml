# Data sources, run in this order on refresh. To add one: write an adapter subclassing
# app.sources.base.Source, then add an entry here. `schedule` is a cron expression (NYC time);
# omit it for manual-only sources. Set `enabled: false` to turn a source off.

sources:
  # --- geography (must run first) ---
  nta_boundaries:
    adapter: app.sources.nta_boundaries.NtaBoundaries
    schedule: "0 3 1 1 *"          # yearly

  # --- national signals (any loaded region, keyed by census tract) ---
  fhfa_tract_hpi:
    adapter: app.sources.fhfa_hpi.FhfaTractHpi
    schedule: "0 6 15 3 *"         # yearly - FHFA publishes this index once a year

  # --- closed sales & price history ---
  dof_condo_sales:
    adapter: app.sources.dof_sales.DofCondoSales
    schedule: "0 4 * * 1"          # weekly
  zillow_research:
    adapter: app.sources.zillow_research.ZillowResearch
    schedule: "0 5 20 * *"         # monthly

  # --- neighborhood growth signals ---
  housing_database:
    adapter: app.sources.development.HousingDatabase
    schedule: "0 5 1 */3 *"        # quarterly
  rezonings:
    adapter: app.sources.development.Rezonings
    schedule: "0 5 2 * *"
    options: {lookback_years: 10}
  subway_access:
    adapter: app.sources.transit.SubwayAccess
    schedule: "0 5 3 */3 *"
  planned_catalysts:
    adapter: app.sources.transit.PlannedCatalysts
    schedule: "0 5 * * 0"          # re-reads catalysts.yaml weekly
  nypd_felonies:
    adapter: app.sources.livability.NypdFelonies
    schedule: "0 5 15 2 *"         # yearly, once the prior year is published
  liquor_licenses:
    adapter: app.sources.livability.LiquorLicenses
    schedule: "0 5 4 * *"
    options: {recent_years: 3}
  future_floodplain:
    adapter: app.sources.livability.FutureFloodplain
    schedule: "0 5 5 1 *"
  census_acs:
    adapter: app.sources.census_acs.CensusAcs
    schedule: "0 5 1 1,7 *"

  # --- listings ---
  rentcast_listings:
    adapter: app.sources.rentcast.RentCastListings
    schedule: "0 8 * * *"          # daily at 8am -> at most 31 requests/month
    options:
      max_requests_per_run: 1        # each request returns up to 500 listings
      page_size: 500
      seed_days_old: 30              # an area's first search backfills a month
      max_days_old: 30
      min_hours_between_requests: 24 # also blocks repeated "Refresh now" clicks
      monthly_request_limit: 31      # hard cap; daily cadence never exceeds this, still well under the free plan's 50
      # One area per run, least recently searched first (each ~every 5 days with 5 areas). A request returns the
      # 500 listings nearest the center, so a citywide circle would only ever cover Manhattan.
      areas:
        - {name: manhattan, latitude: 40.7831, longitude: -73.9712, radius: 6}
        - {name: brooklyn, latitude: 40.6500, longitude: -73.9500, radius: 6}
        - {name: queens, latitude: 40.7282, longitude: -73.8300, radius: 7}
        - {name: bronx, latitude: 40.8448, longitude: -73.8648, radius: 5}
        - {name: staten_island, latitude: 40.5795, longitude: -74.1502, radius: 6}
  acris_sold_check:
    adapter: app.sources.acris.AcrisSoldCheck
    schedule: "0 9 * * *"          # daily
