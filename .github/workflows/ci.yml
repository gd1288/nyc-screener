name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Next.js 16's typed routes generate an ambient .d.ts (e.g. LayoutProps) only once a build
      # has run; a standalone `tsc --noEmit` before the first build can't see it yet, so this runs
      # after `build` (which already type-checks, but this keeps a clear, separate signal).
      - run: npx tsc --noEmit

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: uv sync

      - name: Seed a throwaway test database
        working-directory: backend
        run: uv run python -m tests.fixtures.seed
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/backend/data/ci_e2e.db

      - name: Start the backend against the seeded database
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/api/neighborhoods > /dev/null && break
            sleep 1
          done
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/backend/data/ci_e2e.db
          SCHEDULER_ENABLED: "false"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build the frontend against the test backend
        working-directory: frontend
        run: npm run build
        env:
          API_URL: http://127.0.0.1:8000

      - name: Run the Playwright smoke test
        working-directory: frontend
        run: npm run test:e2e
        env:
          API_URL: http://127.0.0.1:8000
          CI: "true"

      - name: Stop the backend
        if: always()
        run: kill "$(cat /tmp/backend.pid)" 2>/dev/null || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
