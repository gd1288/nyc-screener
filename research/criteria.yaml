  - id: scenario_calibration_from_history
    label: Calibrate stress scenarios to real NYC price history
    status: approved
    factor: null
    evidence: "FRED ATNHPIUS35614Q (FHFA All-Transactions HPI, New York-Jersey City-White Plains MSAD, quarterly Q4 1975 to Q1 2026; US government). Peak-to-trough and recovery times would replace the artifact's 'directionally realistic but illustrative' magnitudes. Series ID verified 2026-09-18; history since 1975; worst drawdown -18.2% (Q1 2007 to Q2 2012). Reality check shown in staging; scenario magnitudes themselves not yet re-scaled. Avoid Case-Shiller NYXRSA: S&P prohibits reproduction without written permission."
    memo: research/memos/2026-09-18-data-source-landscape.md
    ui: "Stress test: scenario cards"
    decided: 2026-09-18

