  - id: exit_cap_from_treasury_spread
    label: Exit cap rate and discount rate anchored to the 10-year Treasury
    status: approved
    factor: null
    evidence: "FRED DGS10 (Federal Reserve Board; public domain, citation requested; 5.01% on 2026-09-16). Exit cap and NPV discount rate are fixed assumptions today; anchoring them to Treasury plus a spread ties them to rates. Verified 2026-09-18."
    memo: research/memos/2026-09-18-data-source-landscape.md
    ui: "Stress test: Financing climate dial (exit cap moves with rates)"
    ui_suggestion: {target: staging, description: "Show 10-year Treasury and the mortgage spread beside the Rates dial"}
