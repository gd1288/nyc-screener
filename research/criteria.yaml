# Criteria ledger: the chain research -> approval -> valuation factor -> UI.
#
# One entry per criterion (a thing that might refine the valuation). It exists so no session has to
# remember what was proposed, approved or wired. Facts about the code are checked by
# `app.cli status`; this file records the *decisions and links* that no command can derive.
#
# status: gap       a valuation factor has no live data source (from research/gaps.json)
#         idea      a methodology idea, not yet researched or approved
#         proposed  a candidate source/method exists (research/candidates/*.json or a memo)
#         approved  the user approved it; not yet built
#         live      built and shown in the valuation (fill `factor` and `ui`)
#         rejected  the user declined it (fill `decided` and `reason`; registry.json runs the cooldown)
#
# Rules: never move an entry to `live` without the `factor` name existing in
# backend/app/valuation/factors.py and (if user-facing) the `ui` element existing. Update
# `status`, `decided` and `evidence` in the same session the decision is made.

criteria:
  - id: interest_rate
    label: Mortgage rate
    status: gap
    factor: interest_rate
    evidence: "gaps.json: falls back to a fixed default. PLAN.md names FRED MORTGAGE30US (keyless) as the source; not yet wired."
    memo: research/memos/2026-09-17-valuation-methodology.md
    ui: "Stress test: Rates dial"
    decided: null

  - id: rent_growth
    label: Rent growth
    status: gap
    factor: rent_growth
    evidence: "gaps.json: fixed default (0.03). Memo section 3 idea 1: predict it from neighborhood metrics already collected."
    memo: research/memos/2026-09-17-valuation-methodology.md
    ui: "Stress test: rent growth condition"
    decided: null

